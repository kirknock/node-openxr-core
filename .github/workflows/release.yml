name: Release

# Push a tag matching package.json's version (e.g. v0.3.0) to publish.
# Tags with a prerelease part (v0.4.0-beta.1) go to the "next" dist-tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment named in the npm trusted publisher settings.
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:pure
      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack | tail -n1)" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag "$tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=--generate-notes
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" $flags
